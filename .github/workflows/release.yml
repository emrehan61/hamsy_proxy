name: Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish a draft release for (leave empty to only build/package, no release)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          # macos-13 (Intel) was retired Dec 2025; macos-15-intel is its
          # replacement standard-tier x86_64 runner.
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `corepack prepare` with no args reads the "packageManager" pin from
      # the nearest package.json — run from ui/ so it finds ui/package.json,
      # not a (nonexistent) one at the repo root.
      - name: Enable corepack / activate pinned pnpm
        working-directory: ui
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install UI deps
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build UI
        working-directory: ui
        run: |
          pnpm test
          pnpm build

      # @stable resolves the same channel as rust-toolchain.toml (channel =
      # "stable"); passed explicitly since these are native builds only.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Build hamsy-cli
        run: cargo build --release --features embed-ui -p hamsy-cli --target ${{ matrix.target }}

      - name: Build HAR desktop integration
        run: bash packaging/build-desktop.sh "target/${{ matrix.target }}/release/packaging"

      - name: Check HAR desktop integration
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python3 packaging/test-desktop.py --macos-payload "target/${{ matrix.target }}/release/packaging"
          else
            python3 packaging/test-desktop.py
          fi

      - name: Package tarball
        # Keep hamsy at archive root for existing binary-only self-updaters.
        run: tar czf "hamsy-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" hamsy packaging

      - uses: actions/upload-artifact@v4
        with:
          name: hamsy-${{ matrix.target }}
          path: hamsy-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  build-windows:
    name: build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack / activate pinned pnpm
        working-directory: ui
        shell: pwsh
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack prepare --activate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install UI deps
        working-directory: ui
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'hamsy-pnpm-install.log'
          pnpm install --frozen-lockfile 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = ((Get-Content -LiteralPath $log -Tail 80 | Out-String) -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A')
            for ($offset = 0; $offset -lt $tail.Length; $offset += 2000) {
              $part = [Math]::Floor($offset / 2000) + 1
              $count = [Math]::Min(2000, $tail.Length - $offset)
              Write-Output "::error title=pnpm install failed (part $part)::$($tail.Substring($offset, $count))"
            }
            exit $code
          }

      - name: Build UI
        working-directory: ui
        shell: pwsh
        run: |
          $testLog = Join-Path $env:RUNNER_TEMP 'hamsy-ui-test.log'
          pnpm test 2>&1 | Tee-Object -FilePath $testLog
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = ((Get-Content -LiteralPath $testLog -Tail 100 | Out-String) -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A')
            for ($offset = 0; $offset -lt $tail.Length; $offset += 2000) {
              $part = [Math]::Floor($offset / 2000) + 1
              $count = [Math]::Min(2000, $tail.Length - $offset)
              Write-Output "::error title=Windows UI tests failed (part $part)::$($tail.Substring($offset, $count))"
            }
            exit $code
          }
          $buildLog = Join-Path $env:RUNNER_TEMP 'hamsy-ui-build.log'
          pnpm build 2>&1 | Tee-Object -FilePath $buildLog
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = ((Get-Content -LiteralPath $buildLog -Tail 100 | Out-String) -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A')
            for ($offset = 0; $offset -lt $tail.Length; $offset += 2000) {
              $part = [Math]::Floor($offset / 2000) + 1
              $count = [Math]::Min(2000, $tail.Length - $offset)
              Write-Output "::error title=Windows UI build failed (part $part)::$($tail.Substring($offset, $count))"
            }
            exit $code
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-pc-windows-msvc

      - name: Test Rust workspace
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'hamsy-cargo-test.log'
          cargo test --workspace --locked 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = ((Get-Content -LiteralPath $log -Tail 120 | Out-String) -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A')
            for ($offset = 0; $offset -lt $tail.Length; $offset += 2000) {
              $part = [Math]::Floor($offset / 2000) + 1
              $count = [Math]::Min(2000, $tail.Length - $offset)
              Write-Output "::error title=Windows cargo tests failed (part $part)::$($tail.Substring($offset, $count))"
            }
            exit $code
          }

      - name: Build hamsy-cli
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'hamsy-cargo-build.log'
          cargo build --release --features embed-ui -p hamsy-cli --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = ((Get-Content -LiteralPath $log -Tail 120 | Out-String) -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A')
            for ($offset = 0; $offset -lt $tail.Length; $offset += 2000) {
              $part = [Math]::Floor($offset / 2000) + 1
              $count = [Math]::Min(2000, $tail.Length - $offset)
              Write-Output "::error title=Windows cargo build failed (part $part)::$($tail.Substring($offset, $count))"
            }
            exit $code
          }

      - name: Check Windows installer and launcher
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'hamsy-windows-packaging.log'
          pwsh -NoProfile -File packaging/test-windows.ps1 `
            -BinaryPath target/x86_64-pc-windows-msvc/release/hamsy.exe `
            -RegistryRoot "Software\Hamsy-CI-${{ github.run_id }}\Classes" 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = ((Get-Content -LiteralPath $log -Tail 80 | Out-String) -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A')
            for ($offset = 0; $offset -lt $tail.Length; $offset += 2000) {
              $part = [Math]::Floor($offset / 2000) + 1
              $count = [Math]::Min(2000, $tail.Length - $offset)
              Write-Output "::error title=Windows packaging test failed (part $part)::$($tail.Substring($offset, $count))"
            }
            exit $code
          }

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'hamsy-windows-package'
          $zip = 'hamsy-x86_64-pc-windows-msvc.zip'
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path (Join-Path $stage 'packaging') -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/hamsy.exe $stage
          Copy-Item install.ps1 $stage
          Copy-Item packaging/windows (Join-Path $stage 'packaging') -Recurse
          Copy-Item docs/images/logo.png (Join-Path $stage 'packaging/windows/hamsy.png')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: hamsy-x86_64-pc-windows-msvc
          path: hamsy-x86_64-pc-windows-msvc.zip
          if-no-files-found: error

  release:
    name: publish release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        shell: bash
        run: |
          : > sha256sums.txt
          for archive in ./*.tar.gz ./*.zip; do
            [ -f "$archive" ] || continue
            sha256sum "$archive" >> sha256sums.txt
          done
          test -s sha256sums.txt

      # Tag push -> real (non-draft) release for that tag. workflow_dispatch
      # -> draft release, and only if a tag_name was given; otherwise this
      # run just builds/packages artifacts without publishing anything.
      - name: Create GitHub Release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          body_path: docs/releases/${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}.md
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
