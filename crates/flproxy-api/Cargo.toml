[package]
name = "flproxy-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "REST + WebSocket API and embedded web UI for flproxy."

[features]
default = []
# Embeds a pre-built `ui/dist` directory into the binary via `rust-embed`.
# Not enabled by default so the crate builds standalone even when `ui/dist`
# does not exist yet (e.g. mid-development, before the UI is built).
embed-ui = ["dep:rust-embed"]

[dependencies]
flproxy-core = { path = "../flproxy-core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
url = { workspace = true }

# Not present in [workspace.dependencies]; pinned directly here.
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "set-header", "trace", "limit"] }
futures-util = "0.3"
async-trait = "0.1"
mime_guess = "2"
qrcode = "0.14"
if-addrs = "0.13"
rust-embed = { version = "8", optional = true, features = ["interpolate-folder-path"] }

[dev-dependencies]
tokio-tungstenite = "0.24"
