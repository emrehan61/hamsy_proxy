[package]
name = "flproxy-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line entry point for flproxy."

[[bin]]
name = "flproxy"
path = "src/main.rs"

[dependencies]
flproxy-core = { path = "../flproxy-core" }
flproxy-proxy = { path = "../flproxy-proxy" }
flproxy-api = { path = "../flproxy-api" }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }

# Not present in [workspace.dependencies]; pinned directly here.
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
open = "5"
async-trait = "0.1"
# Pinned to match flproxy-api's axum version, since we call `axum::serve`
# directly on the `Router` it builds.
axum = { version = "0.8" }

[features]
embed-ui = ["flproxy-api/embed-ui"]
