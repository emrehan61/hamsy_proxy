[package]
name = "rdproxy-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line entry point for rdproxy."

[[bin]]
name = "rdproxy"
path = "src/main.rs"

[dependencies]
rdproxy-core = { path = "../rdproxy-core" }
rdproxy-proxy = { path = "../rdproxy-proxy" }
rdproxy-api = { path = "../rdproxy-api" }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }

# Not present in [workspace.dependencies]; pinned directly here.
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
open = "5"
async-trait = "0.1"
# Pinned to match rdproxy-api's axum version, since we call `axum::serve`
# directly on the `Router` it builds.
axum = { version = "0.8" }

[features]
embed-ui = ["rdproxy-api/embed-ui"]
