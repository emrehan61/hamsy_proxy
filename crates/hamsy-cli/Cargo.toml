[package]
name = "hamsy-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line entry point for hamsy-proxy."

[[bin]]
name = "hamsy"
path = "src/main.rs"

[dependencies]
hamsy-core = { path = "../hamsy-core" }
hamsy-proxy = { path = "../hamsy-proxy" }
hamsy-api = { path = "../hamsy-api" }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
libc = "0.2"
ring = "0.17"

# Not present in [workspace.dependencies]; pinned directly here.
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
open = "5"
async-trait = "0.1"
# Pinned to match hamsy-api's axum version, since we call `axum::serve`
# directly on the `Router` it builds.
axum = { version = "0.8" }
# `hamsy update`. Default features pull in reqwest+native-tls; swap to
# rustls (portable, no system OpenSSL/native-tls dependency) and only the
# archive/compression support used by the release workflow's `.tar.gz` and
# Windows `.zip` assets.
self_update = { version = "0.44", default-features = false, features = [
    "reqwest",
    "rustls",
    "archive-tar",
    "archive-zip",
    "compression-flate2",
    "compression-zip-deflate",
] }
# self_update's reqwest+rustls feature pulls in rustls with aws-lc-rs, while
# hamsy-proxy pulls in rustls with ring (see hamsy-proxy/Cargo.toml). With
# both backends in the tree, rustls 0.23 can't auto-pick a process-level
# CryptoProvider and panics on first TLS use. Depend on rustls here too,
# pinned to the same version/feature set as hamsy-proxy (ring only), so we
# can install ring as the default provider explicitly in main().
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }

[target.'cfg(windows)'.dependencies]
# HAR viewer credentials and discovery metadata are protected with a private
# DACL, and its detached service uses the native Windows process APIs.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[features]
embed-ui = ["hamsy-api/embed-ui"]

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
zip = { version = "6", default-features = false, features = ["deflate", "time"] }
